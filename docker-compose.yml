services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow
      POSTGRES_DB: stockflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./backend/scripts/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      APP_NAME: stockflow
      APP_ENV: production
      APP_PORT: "8080"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: stockflow
      DATABASE_PASSWORD: stockflow
      DATABASE_NAME: stockflow
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/vite-project
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
